[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroglycemic-sentinel"
version = "0.4.0"
description = "Causal multimodal neural glucose forecasting research software"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
acquisition = ["pylsl>=1.16,<2", "pyxdf>=1.16.8,<1.17"]
plots = ["matplotlib>=3.8,<4"]
llm = ["langchain-core>=1.0,<2", "langchain-openai>=1.0,<2"]
excel = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
